name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.8 (MSVC 2022 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          # WebEngine is MSVC-only on Windows, hence the arch above.
          modules: >-
            qtserialport
            qtserialbus
            qtmultimedia
            qtvirtualkeyboard
            qtwebview
            qtpositioning
            qtwebchannel
            qtwebengine
            qtwebsockets
          cache: true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build (qmake + nmake)
        shell: cmd
        run: |
          qmake IPS4MCO.pro
          nmake release

      - name: Deploy runtime files (windeployqt)
        shell: cmd
        run: |
          mkdir dist
          copy release\IPS4MCO.exe dist\
          windeployqt --release --compiler-runtime --qmldir qml dist\IPS4MCO.exe
          xcopy /E /I /Y config dist\config\
          xcopy /E /I /Y fonts dist\fonts\
          copy /Y instruction.jpg dist\
          copy /Y icon.ico dist\

      - name: Copy MSVC runtime DLLs into dist
        shell: pwsh
        run: |
          # ZIP должен быть самодостаточным: кладём msvcp140/vcruntime140 рядом с exe.
          # Ищем по любой версии VS (2022, 18 и т.д.) — runner'ы меняются.
          $roots = @("${env:ProgramFiles}\Microsoft Visual Studio", "${env:ProgramFiles(x86)}\Microsoft Visual Studio") |
                   Where-Object { Test-Path $_ }
          $candidates = foreach ($r in $roots) {
            Get-ChildItem $r -Recurse -Filter "msvcp140.dll" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\(Redist|Tools)\\MSVC(\\[\d\.]+)?\\' -and $_.FullName -match '\\x64(\\|$)' }
          }
          $crt = $candidates | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $crt) {
            # запасной вариант: любой x64 msvcp140.dll под VS
            $crt = $roots | ForEach-Object { Get-ChildItem $_ -Recurse -Filter "msvcp140.dll" -ErrorAction SilentlyContinue } |
                   Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          }
          if ($crt) {
            Write-Host "Copying CRT from: $($crt.DirectoryName)"
            Copy-Item "$($crt.DirectoryName)\msvcp140*.dll" dist\
            Copy-Item "$($crt.DirectoryName)\vcruntime140*.dll" dist\
            Copy-Item "$($crt.DirectoryName)\concrt140.dll" dist\ -ErrorAction SilentlyContinue
          } else {
            Write-Host "CRT not found in VS dir, relying on windeployqt --compiler-runtime"
          }
          Get-ChildItem dist\*.dll | Where-Object { $_.Name -match "msvcp|vcruntime|concrt" } | ForEach-Object { Write-Host $_.Name }

      - name: Download MariaDB Connector/C (client library for QMYSQL)
        shell: pwsh
        run: |
          curl.exe -sL -o mariadb.msi https://dlm.mariadb.com/Connectors/c/connector-c-3.4.5/mariadb-connector-c-3.4.5-win64.msi
          if (-not (Test-Path mariadb.msi)) { Write-Host "::error::mariadb.msi download failed"; exit 1 }
          $p = Start-Process msiexec -ArgumentList "/a","mariadb.msi","/qn","/norestart","TARGETDIR=$env:GITHUB_WORKSPACE\mariadb" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "::error::msiexec extract failed: $($p.ExitCode)"; exit 1 }

          # Locate headers and libraries (MSI layout varies slightly)
          $inc   = Get-ChildItem -Recurse mariadb -Filter mysql.h | Select-Object -First 1
          $lib   = Get-ChildItem -Recurse mariadb -Filter libmariadb.lib | Select-Object -First 1
          $dll   = Get-ChildItem -Recurse mariadb -Filter libmariadb.dll | Select-Object -First 1
          if (-not $inc -or -not $dll) { Write-Host "::error::mariadb files not found after extract"; exit 1 }
          Write-Host "headers: $($inc.DirectoryName)"
          Write-Host "dll:     $($dll.FullName)"

          New-Item -ItemType Directory -Force C:\mariadb\include | Out-Null
          New-Item -ItemType Directory -Force C:\mariadb\lib    | Out-Null
          Copy-Item "$($inc.DirectoryName)\*" C:\mariadb\include\ -Recurse -Force
          Copy-Item $dll.FullName C:\mariadb\lib\

          if ($lib) {
            Copy-Item $lib.FullName C:\mariadb\lib\
          } else {
            Write-Host "libmariadb.lib not in MSI - generating import library from DLL"
            $out  = & dumpbin /exports $dll.FullName
            $names = $out | Select-String -Pattern '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\w+)' |
                     ForEach-Object { $_.Matches[0].Groups[1].Value }
            ("EXPORTS`r`n" + (($names | ForEach-Object { "    $_" }) -join "`r`n")) |
              Out-File C:\mariadb\lib\libmariadb.def -Encoding ascii
            & lib /def:C:\mariadb\lib\libmariadb.def /out:C:\mariadb\lib\libmariadb.lib /machine:x64
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Get-ChildItem C:\mariadb\lib

      - name: Build MySQL driver (qsqlmysql)
        shell: cmd
        run: |
          cd sqldrivers\mysql
          qmake mysql.pro "INCLUDEPATH+=C:/mariadb/include" "LIBS+=-LC:/mariadb/lib -llibmariadb"
          if errorlevel 1 exit /b 1
          nmake release
          if errorlevel 1 exit /b 1
          dir release

      - name: Install MySQL driver into dist (+ QtPositioning module)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\sqldrivers | Out-Null
          Copy-Item sqldrivers\mysql\release\qsqlmysql.dll dist\sqldrivers\ -Force
          if (-not (Test-Path dist\sqldrivers\qsqlmysql.dll)) { Write-Host "::error::qsqlmysql.dll missing"; exit 1 }
          # клиентская библиотека и её соседи по папке (libssl и т.п., если есть)
          Copy-Item C:\mariadb\lib\*.dll dist\ -Force
          Write-Host "OK: qsqlmysql.dll + libmariadb.dll installed"

          # windeployqt не кладёт qml/QtPositioning, а QtWebView-экранам он нужен
          $qtdir = $env:QT_ROOT_DIR
          if (-not $qtdir) { $qtdir = Split-Path (Get-Command qmake).Source -Parent }
          $pos = Join-Path $qtdir "qml\QtPositioning"
          if (Test-Path $pos) {
            New-Item -ItemType Directory -Force dist\qml | Out-Null
            Copy-Item $pos dist\qml\ -Recurse -Force
            Write-Host "OK: qml/QtPositioning copied"
          } else {
            Write-Host "::warning::qml/QtPositioning отсутствует"
          }

      - name: Verify MSVC runtime present
        shell: pwsh
        run: |
          $need = @("msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll")
          foreach ($f in $need) {
            if (-not (Test-Path "dist\$f")) { Write-Host "::error::Missing $f in dist"; exit 1 }
            Write-Host "OK: $f"
          }

      - name: Package ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath IPS4MCO-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPS4MCO-windows
          path: |
            IPS4MCO-windows.zip
          retention-days: 30

      - name: Create GitHub Release (for OTA)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            IPS4MCO-windows.zip
          generate_release_notes: true
